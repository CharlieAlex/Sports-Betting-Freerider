name: Get Prediction

on:
    schedule:
        - cron: "13 17 * * *"

jobs:
    send-message:
        runs-on: ubuntu-latest

        steps:
            - name: Send message to LINE Notify
              env:
                  LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
              run: |
                  # First message
                  curl -X POST https://notify-api.line.me/api/notify \
                    -H "Authorization: Bearer $LINE_NOTIFY_TOKEN" \
                    -F "message=喚醒 Line 機器人"

                  sleep 300

                  # Second message
                  curl -X POST https://notify-api.line.me/api/notify \
                    -H "Authorization: Bearer $LINE_NOTIFY_TOKEN" \
                    -F "message=NBA thismonth 30"

                  curl -X POST https://notify-api.line.me/api/notify \
                    -H "Authorization: Bearer $LINE_NOTIFY_TOKEN" \
                    -F "message=NBA lastmonth 30"

                  sleep 60

                  # Third message
                  curl -X POST https://notify-api.line.me/api/notify \
                    -H "Authorization: Bearer $LINE_NOTIFY_TOKEN" \
                    -F "message=NHL冰球 thismonth 30"

                  curl -X POST https://notify-api.line.me/api/notify \
                    -H "Authorization: Bearer $LINE_NOTIFY_TOKEN" \
                    -F "message=NHL冰球 lastmonth 30"

                  sleep 60

                  # Fourth message
                  curl -X POST https://notify-api.line.me/api/notify \
                    -H "Authorization: Bearer $LINE_NOTIFY_TOKEN" \
                    -F "message=MLB thismonth 30"

                  curl -X POST https://notify-api.line.me/api/notify \
                    -H "Authorization: Bearer $LINE_NOTIFY_TOKEN" \
                    -F "message=MLB lastmonth 30"
