services:
- type: web
  name: Sports-Betting-Freerider
  env: python
  repo: https://github.com/CharlieAlex/Sports-Betting-Freerider
  buildCommand: pip install -r requirements.txt
  startCommand: gunicorn linebot_main:app --timeout 300
  plan: free
  autoDeploy: false
  envVars:
  - key: CHANNEL_ACCESS_TOKEN
    sync: false
  - key: CHANNEL_SECRET
    sync: false
  - key: TZ
    sync: false